<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | SUCHI 24/7</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .error-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 2rem;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 1rem;
        }
        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        .error-message {
            color: var(--text-muted);
            max-width: 500px;
            margin: 0 auto 2.5rem auto;
            line-height: 1.7;
        }
        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-secondary {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }
        .btn-secondary:hover {
            background-color: var(--bg-card);
            color: var(--text-main);
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">
                The page you are looking for doesn't exist or has been moved. Let's get you back on track.
            </p>
            <div class="error-actions">
                <a href="/" class="btn btn-primary">🏠 Go Home</a>
                <a href="javascript:history.back()" class="btn btn-secondary">← Go Back</a>
            </div>
            <div class="footer" style="margin-top: 3rem; border: none; background: transparent;">
                <p>&copy; 2026 SUCHI 24/7 | <a href="https://discord.gg/pvtBvKUKC8">Join our Discord</a></p>
            </div>
        </div>
    </div>
</body>
</html>
